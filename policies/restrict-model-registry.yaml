apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-model-registry
  annotations:
    policies.kyverno.io/title: Restrict Model Registry Sources
    policies.kyverno.io/category: ML Governance
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: "1.6.0"
    policies.kyverno.io/description: >
      Ensures model containers deployed to ml-production are only pulled
      from approved KitOps OCI registries (ghcr.io/myorg).
      Any image from an unauthorized source will be rejected at admission.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: check-model-registry
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - ml-production
      validate:
        message: >
          ❌ Policy violation: Model images must come from approved registries.
          Allowed: ghcr.io/myorg/*
          Got: {{ request.object.spec.containers[0].image }}
          Contact your ML Platform team to add new registries.
        pattern:
          spec:
            containers:
              - image: "ghcr.io/myorg/*"
